name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup jdk 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v3

      - name: chmod gradle
        run: chmod +x gradlew

      - name: build apk
        run: ./gradlew assembleDebug --stacktrace

      - name: rename apk
        run: |
          mkdir -p build/outputs/release
          cp app/build/outputs/apk/debug/app-debug.apk build/outputs/release/app-${{ github.ref_name }}.apk

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/release/app-${{ github.ref_name }}.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
